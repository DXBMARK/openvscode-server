name: WPCodeSpace OpenVSCode GHCR Publish

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/wpcodespace-ghcr-publish.yml
      - src/vs/workbench/contrib/chat/**
      - package.json
      - package-lock.json
      - .nvmrc

permissions:
  contents: read
  packages: write

jobs:
  publish-image:
    name: Publish OpenVSCode image to GHCR
    if: ${{ github.repository == 'DXBMARK/openvscode-server' && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      VSCODE_ARCH: x64
      IMAGE_NAME: ghcr.io/dxbmark/wpcodespace-openvscode

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read Node version
        id: node-version
        shell: bash
        run: |
          echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"
          cat .nvmrc

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          cache: npm

      - name: Install Linux native build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            python3 \
            make \
            g++ \
            pkg-config \
            libkrb5-dev \
            libx11-dev \
            libxkbfile-dev

      - name: Show environment
        shell: bash
        run: |
          node -v
          npm -v
          python3 --version
          gcc --version
          g++ --version
          docker --version
          uname -a
          git rev-parse HEAD
          echo "VSCODE_ARCH=$VSCODE_ARCH"
          echo "IMAGE_NAME=$IMAGE_NAME"
          echo "SHA_TAG=$IMAGE_NAME:sha-${GITHUB_SHA}"
          echo "SHORT_SHA_TAG=$IMAGE_NAME:${GITHUB_SHA::12}"

      - name: Install dependencies
        shell: bash
        run: npm ci

      - name: Prepare build metadata
        shell: bash
        run: |
          mkdir -p out-build
          date -u +"%Y-%m-%dT%H:%M:%SZ" > out-build/date
          echo "out-build/date=$(cat out-build/date)"

      - name: Build Linux web server output
        shell: bash
        run: |
          npm run server:init
          npm run compile-web
          npm run gulp vscode-reh-web-linux-${VSCODE_ARCH}-min-ci
          npm run gulp vscode-web-min-ci

      - name: Locate OpenVSCode runtime and web assets
        shell: bash
        run: |
          SERVER_OUTPUT="../vscode-reh-web-linux-${VSCODE_ARCH}"
          SEARCH_ROOTS=(
            "."
            "out"
            "out-build"
            "$SERVER_OUTPUT"
            "../vscode-reh-linux-${VSCODE_ARCH}"
            "../vscode-web"
            "out-vscode-reh-web-min"
            "out-vscode-web-min"
            "../vscode-server-linux-${VSCODE_ARCH}-web"
          )

          print_candidates() {
            local label="$1"
            local pattern="$2"

            echo "$label"
            for search_root in "${SEARCH_ROOTS[@]}"; do
              if [ -e "$search_root" ]; then
                find "$search_root" -path "$pattern" -print
              fi
            done | sort -u | sed -n '1,80p'
          }

          echo "=== Locate OpenVSCode runtime and web assets ==="
          print_candidates "server-main.js candidates:" "*/server-main.js"
          print_candidates "workbench.css candidates:" "*/vs/code/browser/workbench/workbench.css"
          print_candidates "nls.messages.js candidates:" "*/nls.messages.js"
          print_candidates "nls.messages.json candidates:" "*/nls.messages.json"

      - name: Validate server output path
        shell: bash
        run: |
          SERVER_OUTPUT="../vscode-reh-web-linux-${VSCODE_ARCH}"

          if [ ! -d "$SERVER_OUTPUT" ]; then
            echo "Missing server output directory: $SERVER_OUTPUT"
            ls -la ..
            exit 1
          fi

          if [ ! -x "$SERVER_OUTPUT/bin/openvscode-server" ]; then
            echo "Missing executable: $SERVER_OUTPUT/bin/openvscode-server"
            find "$SERVER_OUTPUT/bin" -maxdepth 2 -type f -print
            exit 1
          fi

          if [ ! -x "$SERVER_OUTPUT/node" ]; then
            echo "Missing executable: $SERVER_OUTPUT/node"
            find "$SERVER_OUTPUT" -maxdepth 2 -type f -name node -print
            exit 1
          fi

          if [ ! -f "$SERVER_OUTPUT/out/server-main.js" ]; then
            echo "Packaged output is missing runtime entrypoint: $SERVER_OUTPUT/out/server-main.js"
            echo "Attempting to assemble runtime from repository out/ directory"

            if [ ! -f "out/server-main.js" ]; then
              echo "Missing built runtime entrypoint: out/server-main.js"
              echo "Repository out/ files:"
              find out -maxdepth 4 -type f | sort | sed -n '1,240p' || true
              echo "Packaged output files:"
              find "$SERVER_OUTPUT" -maxdepth 4 -type f | sort | sed -n '1,240p'
              exit 1
            fi

            mkdir -p "$SERVER_OUTPUT/out"
            cp -a out/. "$SERVER_OUTPUT/out/"
          fi

          if [ ! -f "$SERVER_OUTPUT/out/server-main.js" ]; then
            echo "Missing runtime entrypoint after assembly: $SERVER_OUTPUT/out/server-main.js"
            exit 1
          fi

          echo "Found runtime entrypoint: $SERVER_OUTPUT/out/server-main.js"
          echo "Found server output: $SERVER_OUTPUT"
          du -sh "$SERVER_OUTPUT"
          find "$SERVER_OUTPUT" -maxdepth 3 -type f | sort | sed -n '1,160p'

      - name: Create Docker build context
        shell: bash
        run: |
          SERVER_OUTPUT="../vscode-reh-web-linux-${VSCODE_ARCH}"
          IMAGE_CONTEXT="/tmp/wpcodespace-openvscode-image"

          rm -rf "$IMAGE_CONTEXT"
          mkdir -p "$IMAGE_CONTEXT/openvscode-server"

          cp -a "$SERVER_OUTPUT/." "$IMAGE_CONTEXT/openvscode-server/"

          WEB_ASSET_SOURCE=""
          WEB_ASSET_CANDIDATES=(
            "$SERVER_OUTPUT"
            "../vscode-web"
            "../vscode-reh-web-linux-${VSCODE_ARCH}"
            "../vscode-server-linux-${VSCODE_ARCH}-web"
            "out-vscode-reh-web-min"
            "out-vscode-web-min"
          )

          for candidate in "${WEB_ASSET_CANDIDATES[@]}"; do
            if [ -f "$candidate/out/vs/code/browser/workbench/workbench.css" ] && [ -f "$candidate/out/nls.messages.js" ]; then
              WEB_ASSET_SOURCE="$candidate"
              break
            fi
          done

          if [ -z "$WEB_ASSET_SOURCE" ]; then
            echo "Missing web client asset source with required workbench.css and nls.messages.js"
            echo "=== Locate OpenVSCode runtime and web assets ==="
            echo "server-main.js candidates:"
            for search_root in . out out-build "$SERVER_OUTPUT" "../vscode-reh-linux-${VSCODE_ARCH}" "../vscode-web" out-vscode-reh-web-min out-vscode-web-min "../vscode-server-linux-${VSCODE_ARCH}-web"; do
              if [ -e "$search_root" ]; then
                find "$search_root" -path "*/server-main.js" -print
              fi
            done | sort -u | sed -n '1,80p'
            echo "workbench.css candidates:"
            for search_root in . out out-build "$SERVER_OUTPUT" "../vscode-reh-linux-${VSCODE_ARCH}" "../vscode-web" out-vscode-reh-web-min out-vscode-web-min "../vscode-server-linux-${VSCODE_ARCH}-web"; do
              if [ -e "$search_root" ]; then
                find "$search_root" -path "*/vs/code/browser/workbench/workbench.css" -print
              fi
            done | sort -u | sed -n '1,80p'
            echo "nls.messages.js candidates:"
            for search_root in . out out-build "$SERVER_OUTPUT" "../vscode-reh-linux-${VSCODE_ARCH}" "../vscode-web" out-vscode-reh-web-min out-vscode-web-min "../vscode-server-linux-${VSCODE_ARCH}-web"; do
              if [ -e "$search_root" ]; then
                find "$search_root" -path "*/nls.messages.js" -print
              fi
            done | sort -u | sed -n '1,80p'
            echo "nls.messages.json candidates:"
            for search_root in . out out-build "$SERVER_OUTPUT" "../vscode-reh-linux-${VSCODE_ARCH}" "../vscode-web" out-vscode-reh-web-min out-vscode-web-min "../vscode-server-linux-${VSCODE_ARCH}-web"; do
              if [ -e "$search_root" ]; then
                find "$search_root" -path "*/nls.messages.json" -print
              fi
            done | sort -u | sed -n '1,80p'
            exit 1
          fi

          echo "Using web client asset source: $WEB_ASSET_SOURCE"
          mkdir -p "$IMAGE_CONTEXT/openvscode-server/out"
          cp -a "$WEB_ASSET_SOURCE/out/." "$IMAGE_CONTEXT/openvscode-server/out/"

          python3 - "$IMAGE_CONTEXT/Dockerfile" <<'PYTHON'
          from pathlib import Path
          import textwrap
          import sys

          dockerfile = textwrap.dedent(r'''
          FROM ubuntu:24.04

          RUN apt-get update && apt-get install -y --no-install-recommends \
            ca-certificates \
            git \
            libatomic1 \
            libkrb5-3 \
            libsecret-1-0 \
            libx11-6 \
            libxkbfile1 \
            locales \
            openssh-client \
            procps \
            && rm -rf /var/lib/apt/lists/*

          RUN useradd -m -u 10001 openvscode

          COPY openvscode-server/ /opt/openvscode-server/

          RUN chmod +x \
            /opt/openvscode-server/bin/openvscode-server \
            /opt/openvscode-server/node \
            && chown -R openvscode:openvscode /opt/openvscode-server /home/openvscode

          USER openvscode
          WORKDIR /home/openvscode

          EXPOSE 3000

          CMD ["/opt/openvscode-server/bin/openvscode-server", "--host", "0.0.0.0", "--port", "3000", "--without-connection-token"]
          ''').lstrip()

          Path(sys.argv[1]).write_text(dockerfile + "\n", encoding="utf-8")
          PYTHON

          head -n 1 "$IMAGE_CONTEXT/Dockerfile"
          test "$(head -n 1 "$IMAGE_CONTEXT/Dockerfile")" = "FROM ubuntu:24.04"
          grep -nE '^[[:space:]]+(FROM|RUN|COPY|USER|WORKDIR|EXPOSE|CMD)\b' "$IMAGE_CONTEXT/Dockerfile" && exit 1 || true

          REQUIRED_CONTEXT_FILES=(
            "$IMAGE_CONTEXT/openvscode-server/out/server-main.js"
            "$IMAGE_CONTEXT/openvscode-server/out/vs/code/browser/workbench/workbench.css"
            "$IMAGE_CONTEXT/openvscode-server/out/nls.messages.js"
          )

          for required_file in "${REQUIRED_CONTEXT_FILES[@]}"; do
            if [ ! -f "$required_file" ]; then
              echo "Missing Docker context file: $required_file"
              echo "Docker context out files:"
              find "$IMAGE_CONTEXT/openvscode-server/out" -maxdepth 6 -type f | sort | sed -n '1,240p'
              echo "Discovered source files:"
              find "$WEB_ASSET_SOURCE/out" -maxdepth 6 -type f | sort | sed -n '1,240p'
              exit 1
            fi
          done

          echo "Found web client assets in Docker context"

          echo "=== Docker context ==="
          find "$IMAGE_CONTEXT" -maxdepth 3 -type f | sort | sed -n '1,160p'
          du -sh "$IMAGE_CONTEXT"

      - name: Build publish image
        shell: bash
        run: |
          SHA_TAG="$IMAGE_NAME:sha-${GITHUB_SHA}"
          SHORT_SHA_TAG="$IMAGE_NAME:${GITHUB_SHA::12}"

          docker build \
            --pull \
            -t "$SHA_TAG" \
            -t "$SHORT_SHA_TAG" \
            /tmp/wpcodespace-openvscode-image

          docker image inspect "$SHA_TAG" \
            --format 'image={{.Id}} size={{.Size}} created={{.Created}}'

      - name: Validate built image web assets
        shell: bash
        run: |
          SHA_TAG="$IMAGE_NAME:sha-${GITHUB_SHA}"

          docker run --rm --entrypoint /bin/sh "$SHA_TAG" -c '
            set -eu
            test -f /opt/openvscode-server/out/server-main.js
            test -f /opt/openvscode-server/out/vs/code/browser/workbench/workbench.css
            test -f /opt/openvscode-server/out/nls.messages.js
          '

          echo "Found web client assets in built image"

      - name: Run container smoke test
        shell: bash
        run: |
          SHA_TAG="$IMAGE_NAME:sha-${GITHUB_SHA}"
          SMOKE_LOG=/tmp/openvscode-smoke.log

          docker rm -f wpcodespace-openvscode-smoke 2>/dev/null || true

          docker run -d \
            --name wpcodespace-openvscode-smoke \
            -p 3000:3000 \
            "$SHA_TAG"

          fail_on_missing_asset_logs() {
            docker logs wpcodespace-openvscode-smoke > "$SMOKE_LOG" 2>&1 || true

            if grep -F \
              -e "File not found: /opt/openvscode-server/out/vs/code/browser/workbench/workbench.css" \
              -e "File not found: /opt/openvscode-server/out/nls.messages.js" \
              -e "Error reading NLS messages file" \
              "$SMOKE_LOG"; then
              echo "OpenVSCode reported missing web client assets"
              cat "$SMOKE_LOG"
              docker rm -f wpcodespace-openvscode-smoke
              exit 1
            fi
          }

          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/ >/tmp/openvscode-smoke-response.html; then
              echo "OpenVSCode responded on attempt $i"
              head -40 /tmp/openvscode-smoke-response.html
              curl -fsS http://127.0.0.1:3000/out/vs/code/browser/workbench/workbench.css >/tmp/openvscode-smoke-workbench.css
              curl -fsS http://127.0.0.1:3000/out/nls.messages.js >/tmp/openvscode-smoke-nls.messages.js
              fail_on_missing_asset_logs
              tail -120 "$SMOKE_LOG"
              docker rm -f wpcodespace-openvscode-smoke
              exit 0
            fi

            echo "Waiting for OpenVSCode to respond... attempt $i"
            fail_on_missing_asset_logs
            tail -80 "$SMOKE_LOG" || true
            sleep 2
          done

          echo "OpenVSCode did not respond in time"
          docker ps -a
          docker logs wpcodespace-openvscode-smoke || true
          docker rm -f wpcodespace-openvscode-smoke
          exit 1

      - name: Verify no manual generated bundle patch is required
        shell: bash
        run: |
          GENERATED_BUNDLE_CHANGES="$(git diff --name-only -- ':(glob)**/workbench.js' ':(glob)**/nls.messages*')"

          if [ -n "$GENERATED_BUNDLE_CHANGES" ]; then
            echo "Generated runtime bundle files changed unexpectedly."
            echo "$GENERATED_BUNDLE_CHANGES"
            exit 1
          fi

          echo "OK: no tracked generated workbench.js or nls.messages changes"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push immutable image tags
        shell: bash
        run: |
          SHA_TAG="$IMAGE_NAME:sha-${GITHUB_SHA}"
          SHORT_SHA_TAG="$IMAGE_NAME:${GITHUB_SHA::12}"

          docker push "$SHA_TAG"
          docker push "$SHORT_SHA_TAG"

          echo "Published image references:"
          echo "$SHA_TAG"
          echo "$SHORT_SHA_TAG"
